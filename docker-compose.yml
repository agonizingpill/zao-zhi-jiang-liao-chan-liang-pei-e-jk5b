name: pulp-output-quota

services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pulp-output-quota}-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulp_quota}
      POSTGRES_USER: ${POSTGRES_USER:-pulp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulp_dev_password}
    ports:
      - "${DB_PORT:-17766}:5432"
    volumes:
      - pulp_quota_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulp} -d ${POSTGRES_DB:-pulp_quota}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-pulp-output-quota}-redis
    ports:
      - "16366:6379"
    volumes:
      - pulp_quota_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-pulp-output-quota}-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pulp:pulp_dev_password@db:5432/pulp_quota}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-gb1067-pulp-secret-change-me}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "${BACKEND_PORT:-19266}:8000"
    volumes:
      - pulp_quota_shared:/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-pulp-output-quota}-worker
    command: ["python", "-m", "src.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://pulp:pulp_dev_password@db:5432/pulp_quota}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-gb1067-pulp-secret-change-me}
    volumes:
      - pulp_quota_shared:/shared
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared/worker-heartbeat && test $$(find /shared/worker-heartbeat -mmin -2 | wc -l) -eq 1"]
      interval: 10s
      timeout: 4s
      retries: 20

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-pulp-output-quota}-frontend
    ports:
      - "${FRONTEND_PORT:-18266}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '浆料配额' "]
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  pulp_quota_db_data:
  pulp_quota_redis_data:
  pulp_quota_shared:
